[package]
name = "jilva-core"
# unreleased Phase-1 foundation
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal-independent events, capabilities, output data, and framework foundations for Jilva"

[dependencies]
# Renderer authorities (docs/README.md#rendering-and-layout).
# `unicode-width` decides how many terminal cells a grapheme occupies;
# `unicode-segmentation` decides where graphemes begin and end. Both are
# pure data-table crates: no I/O and no transitive dependencies. `unicode-width` runs without its `cjk` feature, so
# East-Asian-Ambiguous characters are one cell wide.
unicode-width = { version = "0.2.2", default-features = false }
unicode-segmentation = "1.13.3"

[lints]
workspace = true
