[package]
name = "jilva-terminal"
# unreleased Phase-1 foundation
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Synchronous terminal backend and headless test backend for Jilva"

[features]
default = ["crossterm"]
crossterm = ["dep:crossterm"]

[dependencies]
jilva-core = { version = "0.0.0", path = "../jilva-core" }
# ADR-0003 default backend library. Minimal features: `events` is required
# (the entire `crossterm::event` module — read/poll/mouse capture — is gated
# behind it) and `windows` keeps the Windows console API available on the
# §3.10 platform matrix. `bracketed-paste` enables explicitly requested
# paste-mode lifecycle and decoded paste data. Dropped: `derive-more`, `osc52`, `serde`
# (backends exchange plain data, never serialise), `event-stream` (async —
# the seam is sync-only), `use-dev-tty`.
crossterm = { version = "0.29.0", optional = true, default-features = false, features = ["events", "windows", "bracketed-paste"] }

[lints]
workspace = true
