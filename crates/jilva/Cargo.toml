[package]
name = "jilva"
# Unreleased terminal-engine milestone.
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Public facade for the Jilva terminal UI framework"

[features]
default = ["crossterm"]
crossterm = ["jilva-terminal/crossterm"]

[dependencies]
jilva-core = { version = "0.0.0", path = "../jilva-core" }
jilva-terminal = { version = "0.0.0", path = "../jilva-terminal", default-features = false }

[lints]
workspace = true

# Root-level example and integration test live in the repo layout required by
# docs/ARCHITECTURE.md §7 (examples/, tests/) but a virtual workspace root is
# not a Cargo target, so they are wired here to the facade crate. They may
# import the facade only — never jilva-core or jilva-terminal directly.
[[example]]
name = "version"
path = "../../examples/version.rs"

[[example]]
name = "backend_demo"
path = "../../examples/backend_demo.rs"
required-features = ["crossterm"]

[[example]]
name = "headless_demo"
path = "../../examples/headless_demo.rs"

[[example]]
name = "render_demo"
path = "../../examples/render_demo.rs"

[[example]]
name = "view_demo"
path = "../../examples/view_demo.rs"

[[example]]
name = "motion_demo"
path = "../../examples/motion_demo.rs"

[[test]]
name = "facade_smoke"
path = "../../tests/facade_smoke.rs"

[[test]]
name = "backend_session"
path = "../../tests/backend_session.rs"

[[test]]
name = "backend_io"
path = "../../tests/backend_io.rs"

[[test]]
name = "render_pipeline"
path = "../../tests/render_pipeline.rs"

# Std-only micro-benchmarks (facade imports only); `harness = false` keeps the
# workspace free of a benchmarking dependency.
[[bench]]
name = "render_diff"
path = "../../benches/render_diff.rs"
harness = false
