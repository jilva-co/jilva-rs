name: CI

on:
  push:
    branches: [main, phase1-foundation, phase1.5-rfc-sprint, phase1.6-architecture-resolution, phase2-terminal-engine]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting (Rust 1.98.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  quality:
    name: Headless quality (${{ matrix.os }}, Rust 1.98.1)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-rust-1.98.1
      - name: Check default features
        run: cargo check --workspace --all-targets --locked
      - name: Check all features
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Check without default features
        run: cargo check --workspace --all-targets --no-default-features --locked
      - name: Clippy with all features (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy without default features (deny warnings)
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - name: Headless tests with all features
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Headless tests without default features
        run: cargo test --workspace --all-targets --no-default-features --locked
      - name: Headless demo with all features
        run: cargo run -p jilva --example headless_demo --all-features --locked
      - name: Headless demo without terminal library
        run: cargo run -p jilva --example headless_demo --no-default-features --locked
      - name: Rendering demo with all features
        run: cargo run -p jilva --example render_demo --all-features --locked
      - name: Rendering demo without terminal library
        run: cargo run -p jilva --example render_demo --no-default-features --locked
      - name: View demo with all features
        run: cargo run -p jilva --example view_demo --all-features --locked
      - name: View demo without terminal library
        run: cargo run -p jilva --example view_demo --no-default-features --locked
      - name: Motion demo with all features
        run: cargo run -p jilva --example motion_demo --all-features --locked
      - name: Motion demo without terminal library
        run: cargo run -p jilva --example motion_demo --no-default-features --locked
      - name: Design studio headless
        run: cargo run -p jilva --example themes --all-features --locked -- --headless
      - name: Design studio without terminal library
        run: cargo run -p jilva --example themes --no-default-features --locked -- --headless
      - name: Build docs with all features (deny warnings)
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build docs without default features (deny warnings)
        run: cargo doc --workspace --no-default-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Doc tests with all features (deny warnings)
        run: cargo test --workspace --doc --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Doc tests without default features (deny warnings)
        run: cargo test --workspace --doc --no-default-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
